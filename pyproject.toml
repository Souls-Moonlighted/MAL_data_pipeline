[project]
name = "mal_data_pipeline"
version = "0.2"
description = "A data processing pipeline written in polars."
readme = "README.md"

requires-python = ">=3.12"

dependencies = [
    "polars>=1.42.1",
    "scrapy>=2.19.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
    "tzlocal>=5.4.4",
]

[dependency-groups]
dev = [
    "altair[all]>=6.3.0",
    "basedpyright>=1.40.1",
    "duckdb>=1.5.6",
    "marimo>=0.25.1",
    "nbformat>=5.10.4",
    "ruff>=0.15.22",
    "scipy>=1.18.1",
]

# [project.scripts]
# mal_data_pipeline = "mal_data_pipeline.cli.main::app"

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"
