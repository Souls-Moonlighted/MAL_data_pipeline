[project]
name = "data_processing_pipeline"
version = "0.2"
description = "A data processing pipeline written in polars."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair[all]>=6.3.0",
    "duckdb>=1.5.6",
    "marimo>=0.23.14",
    "numpy==2.5.3",
    "polars>=1.42.1",
    "pyarrow>=25.0.1",
    "scipy>=1.16.0",
    "scrapy>=2.19.0",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "nbformat>=5.10.4",
    "ruff>=0.15.22",
]
